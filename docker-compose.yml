services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - SEARXNG_URL=http://searxng:8080
      - OLLAMA_URL=http://ollama:11434
      - HISTORY_FILE=/app/data/history.json
    volumes:
      - bot_data:/app/data
    depends_on:
      - searxng
      - qdrant

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  # Optional: local model and RAG embeddings. Start with `docker compose --profile local up -d`.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  bot_data:
  qdrant_data:
  ollama_data:
