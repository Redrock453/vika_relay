use_default_settings: true
server:
  port: 8080
  bind_address: "0.0.0.0"
  # Overridden by the SEARXNG_SECRET environment variable
  secret_key: "set-SEARXNG_SECRET-in-env"
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
engines:
  - name: google
    engine: google
    shortcut: g
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
  - name: bing
    engine: bing
    shortcut: b
