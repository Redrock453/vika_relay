# Neutral example for a "sensitive -> local only" filter (NOT implemented in v8.3).
# If any rule matches, the request is routed to the local Ollama model and never leaves the host.
route_to: local
rules:
  - name: credentials
    regex: '(?i)(api[_-]?key|password|passwd|secret|token)\s*[:=]'
  - name: private_key
    regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
  - name: card_number
    regex: '\b(?:\d[ -]?){13,19}\b'
  - name: email
    regex: '[\w.+-]+@[\w-]+\.[\w.]+'
  - name: phone
    regex: '\+?\d[\d\s()-]{9,}\d'
  - name: private_ip
    regex: '\b(10|192\.168|172\.(1[6-9]|2\d|3[01]))\.\d+\.\d+(\.\d+)?\b'
  - name: user_marked
    keywords: ['#private', 'confidential', 'internal only']
